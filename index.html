<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adrita Runner</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#140028;
}

/* BEAUTIFUL BACKGROUND */

.game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;

    background:
    linear-gradient(
        to bottom,
        #2b0057 0%,
        #4b2ea7 35%,
        #6d8cff 70%,
        #9bc6ff 100%
    );
}

/* GLOW EFFECT */

.game::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:
    radial-gradient(circle at top,#ff00ff55,transparent 40%),
    radial-gradient(circle at bottom,#00ffff44,transparent 40%);
    z-index:0;
}

/* SCORE */

#score{
    position:absolute;
    top:20px;
    right:20px;
    color:white;
    font-size:28px;
    font-weight:bold;
    z-index:999;
    text-shadow:0 0 10px white;
}

/* LANES */

.lane{
    position:absolute;
    width:33.33%;
    height:100%;
    border-left:3px solid rgba(255,255,255,0.15);
    border-right:3px solid rgba(255,255,255,0.15);
}

.left{
    left:0;
}

.center{
    left:33.33%;
}

.right{
    left:66.66%;
}

/* PLAYER */

#player{
    position:absolute;
    width:70px;
    height:90px;

    background:
    linear-gradient(
        to bottom,
        #00f0ff,
        #00b7ff
    );

    border-radius:18px;

    bottom:120px;
    left:50%;
    transform:translateX(-50%);

    box-shadow:
    0 0 20px #00ffff,
    0 0 40px #00ffff;

    z-index:10;
}

/* PLAYER NAME */

#player::after{
    content:"VITOR AI";
    position:absolute;
    width:100%;
    text-align:center;
    color:white;
    font-size:14px;
    font-weight:bold;
    top:35px;
    text-shadow:0 0 10px white;
}

/* OBSTACLES */

.obstacle{
    position:absolute;
    width:85px;
    height:85px;

    background:
    linear-gradient(
        to bottom,
        #ff003c,
        #ff1744
    );

    border-radius:20px;

    box-shadow:
    0 0 20px red,
    0 0 40px #ff0040;
}

/* TEXT INSIDE RED BOX */

.obstacle::after{
    content:"ADRITA";
    position:absolute;
    width:100%;
    text-align:center;
    color:white;
    font-size:15px;
    font-weight:bold;
    top:32px;
    text-shadow:0 0 10px white;
}

/* COINS */

.coin{
    position:absolute;
    width:42px;
    height:42px;

    background:gold;
    border-radius:50%;

    box-shadow:
    0 0 20px yellow,
    0 0 40px gold;
}

/* MOBILE BUTTONS */

.controls{
    position:absolute;
    bottom:35px;
    width:100%;
    display:flex;
    justify-content:center;
    gap:30px;
    z-index:999;
}

.controls button{

    width:80px;
    height:80px;

    border:none;
    border-radius:50%;

    background:rgba(255,255,255,0.12);

    color:white;
    font-size:30px;

    backdrop-filter:blur(10px);

    box-shadow:
    0 0 20px rgba(255,255,255,0.2);

}

/* RESPONSIVE */

@media(max-width:768px){

    #player{
        width:60px;
        height:80px;
    }

    .obstacle{
        width:70px;
        height:70px;
    }

}

</style>
</head>

<body>

<div id="score">Score: 0</div>

<div class="game">

    <div class="lane left"></div>
    <div class="lane center"></div>
    <div class="lane right"></div>

    <div id="player"></div>

</div>

<!-- CONTROLS -->

<div class="controls">

    <button onclick="moveLeft()">⬅️</button>

    <button onclick="jump()">⬆️</button>

    <button onclick="moveRight()">➡️</button>

</div>

<script>

const player = document.getElementById("player");
const game = document.querySelector(".game");
const scoreText = document.getElementById("score");

let lane = 1;
let jumping = false;

let score = 0;
let speed = 7;

const lanes = [
    "16%",
    "50%",
    "83%"
];

/* PLAYER POSITION */

function updatePlayer(){

    player.style.left = lanes[lane];

}

updatePlayer();

/* LEFT */

function moveLeft(){

    if(lane > 0){

        lane--;
        updatePlayer();

    }

}

/* RIGHT */

function moveRight(){

    if(lane < 2){

        lane++;
        updatePlayer();

    }

}

/* JUMP */

function jump(){

    if(jumping) return;

    jumping = true;

    let height = 120;
    let up = true;

    const jumpInterval = setInterval(()=>{

        if(up){

            height += 12;

            if(height >= 290){

                up = false;

            }

        }else{

            height -= 12;

            if(height <= 120){

                clearInterval(jumpInterval);

                jumping = false;

            }

        }

        player.style.bottom = height + "px";

    },20);

}

/* KEYBOARD */

document.addEventListener("keydown",(e)=>{

    if(e.key === "ArrowLeft"){

        moveLeft();

    }

    if(e.key === "ArrowRight"){

        moveRight();

    }

    if(e.key === "ArrowUp"){

        jump();

    }

});

/* CREATE OBSTACLE */

function createObstacle(){

    const obstacle = document.createElement("div");

    obstacle.classList.add("obstacle");

    const obstacleLane = Math.floor(Math.random()*3);

    obstacle.style.left = lanes[obstacleLane];

    obstacle.style.top = "-120px";

    game.appendChild(obstacle);

    let obstacleTop = -120;

    const moveObstacle = setInterval(()=>{

        obstacleTop += speed;

        obstacle.style.top = obstacleTop + "px";

        const playerRect = player.getBoundingClientRect();
        const obstacleRect = obstacle.getBoundingClientRect();

        /* COLLISION */

        if(

            obstacleRect.bottom > playerRect.top &&
            obstacleRect.top < playerRect.bottom &&
            obstacleRect.left < playerRect.right &&
            obstacleRect.right > playerRect.left &&
            !jumping

        ){

            gameOver();

        }

        /* REMOVE */

        if(obstacleTop > window.innerHeight){

            clearInterval(moveObstacle);

            obstacle.remove();

            score++;

            scoreText.innerHTML = "Score: " + score;

            if(score % 5 === 0){

                speed += 0.5;

            }

        }

    },20);

}

/* CREATE COIN */

function createCoin(){

    const coin = document.createElement("div");

    coin.classList.add("coin");

    const laneCoin = Math.floor(Math.random()*3);

    coin.style.left = lanes[laneCoin];

    coin.style.top = "-50px";

    game.appendChild(coin);

    let coinTop = -50;

    const moveCoin = setInterval(()=>{

        coinTop += speed;

        coin.style.top = coinTop + "px";

        const playerRect = player.getBoundingClientRect();
        const coinRect = coin.getBoundingClientRect();

        /* COLLECT */

        if(

            coinRect.bottom > playerRect.top &&
            coinRect.top < playerRect.bottom &&
            coinRect.left < playerRect.right &&
            coinRect.right > playerRect.left

        ){

            score += 5;

            scoreText.innerHTML = "Score: " + score;

            clearInterval(moveCoin);

            coin.remove();

        }

        /* REMOVE */

        if(coinTop > window.innerHeight){

            clearInterval(moveCoin);

            coin.remove();

        }

    },20);

}

/* GAME OVER */

function gameOver(){

    alert("GAME OVER\n\nFinal Score: " + score);

    location.reload();

}

/* SPAWN */

setInterval(createObstacle,1400);

setInterval(createCoin,2500);

</script>

</body>
</html>
